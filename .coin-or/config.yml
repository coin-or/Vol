Description:
  Slug: Vol
  ShortName: Vol
  LongName: Volume Algorithm
  ShortDescription: A subgradient algorithm that also computes approximate primal solutions.
  LongDescription: |2
    Vol (Volume Algorithm) is an open-source implementation of a subgradient
    method that produces primal as well as dual solutions. The primal solution
    comes from estimating the volumes below the faces of the dual problem. This
    is an approximate method so the primal vector might have small
    infeasiblities that are negligible in many practical settings. The original
    subgradient algorithm produces only dual solutions.
  Manager: Francisco Barahona
  Homepage: https://github.com/coin-or/Vol
  License: Eclipse Public License 2.0
  LicenseURL: http://www.opensource.org/licenses/EPL-2.0
  Zenodo:
  IncludedIn:
    Package: Vol
  Language:
    - C++
  Categories:
    - Optimization deterministic linear continuous

